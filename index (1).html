<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161616"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Paddington Check-in</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#171717;--paper:#f4f1eb;--card:#fff;--line:#d6d0c5;--green:#08783f;--greenbg:#dff5e7;--red:#ad2118;--redbg:#fee6e4;--amber:#795500;--amberbg:#fff0bd}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,560px);margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}h1{font-size:27px;margin:0 0 3px}.subtitle{margin:0 0 14px;color:#686158}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 5px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:10px;color:#6d675e}.sync{font-size:12px;text-align:center;margin:-5px 0 10px;color:#666}.sync.online{color:var(--green)}.sync.offline{color:var(--red)}#reader{overflow:hidden;min-height:280px;background:#111;border-radius:16px;border:1px solid #333}#reader video{object-fit:cover}button,#reader__dashboard_section_csr button{min-height:48px;border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:750;cursor:pointer}#reader__dashboard_section_csr button{background:#fff;color:#111;margin:8px 0}.primary{width:100%;background:var(--ink);color:#fff}.secondary{width:100%;background:#e3ded5;color:var(--ink)}#result{display:none;margin:12px 0;padding:18px;border-radius:16px;border:2px solid}#result.ok{display:block;color:var(--green);background:var(--greenbg);border-color:#65bd8a}#result.used,#result.invalid{display:block;color:var(--red);background:var(--redbg);border-color:#e68179}#result.error{display:block;color:var(--amber);background:var(--amberbg);border-color:#d5ad3e}.result-title{font-size:23px;font-weight:900;margin-bottom:8px}.ticket-type{display:inline-block;background:#171717;color:#fff;border-radius:9px;padding:9px 12px;font-size:18px;font-weight:900;letter-spacing:.02em;margin:2px 0 10px}.customer{font-size:22px;font-weight:800;color:var(--ink)}.details{color:#4e4942;margin-top:5px;line-height:1.45}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}summary{font-weight:750;cursor:pointer}label{display:block;font-size:13px;color:#625d56;margin:12px 0 5px}input{width:100%;min-height:48px;border:1px solid #bdb7ad;border-radius:11px;padding:11px;font-size:16px;background:#fff}.search-result{display:flex;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid #e2ded7;padding:10px 0}.search-result button{flex:0 0 auto;min-height:40px;font-size:13px;background:#171717;color:#fff}.small{font-size:12px;color:#746f67}.footer-actions{display:flex;gap:8px;margin-top:12px}.footer-actions button{min-height:42px;font-size:13px;background:#e3ded5}.overlay{position:fixed;inset:0;background:rgba(20,20,20,.94);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.login{width:min(100%,420px);background:#fff;border-radius:18px;padding:22px}.login h2{margin:0 0 8px}.login p{color:#625d56}.login .error{color:var(--red);min-height:20px;font-size:13px}.hidden{display:none!important}
</style></head><body>
<div id="login-overlay" class="overlay"><div class="login"><h2>Staff access</h2><p>Enter the shared staff code once on each phone.</p><input id="staff-code" type="password" autocomplete="current-password" placeholder="Staff code"><button id="login-button" class="primary">OPEN SCANNER</button><div id="login-error" class="error"></div></div></div>
<main><h1>RIFF Check-in</h1><p class="subtitle">Náttfatapartý: Paddington</p><div id="sync" class="sync">Connecting…</div>
<section class="stats"><div class="stat"><b id="checked">–</b><span>CHECKED IN</span></div><div class="stat"><b id="remaining">–</b><span>REMAINING</span></div><div class="stat"><b id="total">99</b><span>TOTAL</span></div></section>
<div id="reader"></div><div id="result" role="status" aria-live="assertive"></div>
<div class="actions"><button id="next" class="primary">SCAN NEXT</button><button id="undo" class="secondary">UNDO LAST</button></div>
<details><summary>Manual code</summary><label for="manual">QR code / token</label><input id="manual" autocapitalize="none" autocomplete="off" spellcheck="false"><button id="manual-button" class="primary">CHECK IN</button></details>
<details><summary>Find by name or order</summary><label for="search">Name or order number</label><input id="search" autocomplete="off" placeholder="Start typing…"><div id="search-results"></div></details>
<div class="footer-actions"><button id="export">Export check-ins</button><button id="logout">Change staff code</button></div></main>
<script>
const SUPABASE_URL="https://qgoiwpcmhzbadbjhwegq.supabase.co",SUPABASE_KEY="sb_publishable_cov8-Np7uwPtlQ50bez22w_wNP9SADJ";
const api=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),CODE_KEY='riff-paddington-staff-v2',DEVICE_KEY='riff-paddington-device-v2';
let staffCode=localStorage.getItem(CODE_KEY)||'',deviceId=localStorage.getItem(DEVICE_KEY),scanner=null,scanLocked=false,lastToken=null,searchTimer=null;
if(!deviceId){deviceId='phone-'+crypto.randomUUID().slice(0,8);localStorage.setItem(DEVICE_KEY,deviceId)}
const el=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(raw){let v=String(raw||'').trim();try{const u=new URL(v);v=u.searchParams.get('token')||u.searchParams.get('code')||u.searchParams.get('qr')||u.hash.slice(1)||u.pathname.split('/').filter(Boolean).pop()||v}catch(e){}return v.trim()}
function typeLabel(type){return {'Fjölskyldupakki':'FAMILY PACKAGE','Barnamiði':'CHILD TICKET','Fullorðinsmiði':'ADULT TICKET'}[type]||type}
function setSync(ok,text){el('sync').className='sync '+(ok?'online':'offline');el('sync').textContent=(ok?'● ':'● ')+text}
function render(kind,title,ticket,extra=''){el('result').className=kind;el('result').innerHTML='<div class="result-title">'+title+'</div>'+(ticket?'<div class="ticket-type">'+esc(typeLabel(ticket.ticket_type))+'</div><div class="customer">'+esc(ticket.customer)+'</div><div class="details">Order '+esc(ticket.order_no)+' · '+esc(ticket.ticket_id)+'</div>':'')+(extra?'<div class="details">'+esc(extra)+'</div>':'');el('result').scrollIntoView({behavior:'smooth',block:'center'})}
async function rpc(name,args){const {data,error}=await api.rpc(name,args);if(error)throw error;return data}
async function refreshStats(){try{const d=await rpc('paddington_stats',{p_staff_code:staffCode});if(d.status==='unauthorized')return false;el('checked').textContent=d.checked;el('remaining').textContent=d.remaining;el('total').textContent=d.total;setSync(true,'Synced across phones');return true}catch(e){setSync(false,'Offline — check internet');return false}}
async function login(){const code=el('staff-code').value.trim()||staffCode;if(!code)return;el('login-button').disabled=true;el('login-error').textContent='Checking…';staffCode=code;const ok=await refreshStats();el('login-button').disabled=false;if(!ok){el('login-error').textContent='Wrong code or database setup is not finished.';return}localStorage.setItem(CODE_KEY,staffCode);el('login-overlay').classList.add('hidden');startCamera()}
async function checkIn(raw,source='camera'){if(scanLocked)return;const token=normalize(raw);scanLocked=true;render('error','CHECKING…',null,'Contacting the shared check-in list.');try{const d=await rpc('paddington_check_in',{p_token:token,p_staff_code:staffCode,p_device:deviceId+' / '+source});if(d.status==='checked_in'){lastToken=token;render('ok','✓ CHECKED IN',d);navigator.vibrate?.(100)}else if(d.status==='already'){lastToken=null;render('used','✕ ALREADY CHECKED IN',d,'First check-in: '+new Date(d.checked_in_at).toLocaleString());navigator.vibrate?.([160,70,160])}else if(d.status==='invalid'){lastToken=null;render('invalid','✕ INVALID QR',null,'This code is not in the Paddington ticket list.');navigator.vibrate?.([120,80,120])}else if(d.status==='unauthorized'){render('error','ACCESS EXPIRED',null,'Enter the staff code again.');localStorage.removeItem(CODE_KEY);el('login-overlay').classList.remove('hidden')}await refreshStats()}catch(e){render('error','CONNECTION ERROR',null,'Nothing was checked in. Check the internet and try again.');setSync(false,'Offline — check internet')}}
function next(){scanLocked=false;el('result').className='';el('result').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}
function startCamera(){if(scanner)return;if(!window.Html5QrcodeScanner){render('error','SCANNER COULD NOT LOAD',null,'Check the internet and refresh.');return}scanner=new Html5QrcodeScanner('reader',{fps:12,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*.72);return{width:s,height:s}},aspectRatio:1,rememberLastUsedCamera:true,supportedScanTypes:[Html5QrcodeScanType.SCAN_TYPE_CAMERA,Html5QrcodeScanType.SCAN_TYPE_FILE]},false);scanner.render(text=>{if(!scanLocked)checkIn(text)},()=>{})}
el('login-button').onclick=login;el('staff-code').onkeydown=e=>{if(e.key==='Enter')login()};el('next').onclick=next;el('manual-button').onclick=()=>checkIn(el('manual').value,'manual-code');el('manual').onkeydown=e=>{if(e.key==='Enter')checkIn(el('manual').value,'manual-code')};
el('undo').onclick=async()=>{if(!lastToken){render('error','NOTHING TO UNDO',null,'Only the last successful check-in on this phone can be undone.');return}try{const d=await rpc('paddington_undo',{p_token:lastToken,p_staff_code:staffCode});if(d.status==='undone'){render('error','CHECK-IN UNDONE',d);lastToken=null;await refreshStats()}else render('error','NOTHING TO UNDO',null)}catch(e){render('error','CONNECTION ERROR',null,'Nothing was changed.')}};
el('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{const q=el('search').value.trim();el('search-results').innerHTML='';if(q.length<2)return;try{const d=await rpc('paddington_search',{p_query:q,p_staff_code:staffCode});if(!d.results.length){el('search-results').innerHTML='<p class="small">No matching ticket.</p>';return}d.results.forEach(t=>{const row=document.createElement('div');row.className='search-result';row.innerHTML='<div><b>'+esc(t.customer)+'</b><div class="small">'+esc(typeLabel(t.ticket_type))+' · Order '+esc(t.order_no)+(t.checked_in_at?' · CHECKED IN':'')+'</div></div>';const b=document.createElement('button');b.textContent=t.checked_in_at?'SHOW':'CHECK IN';b.onclick=()=>{scanLocked=false;checkIn(t.token,'manual-search')};row.appendChild(b);el('search-results').appendChild(row)})}catch(e){el('search-results').innerHTML='<p class="small">Connection error.</p>'}},300)};
el('export').onclick=async()=>{try{const d=await rpc('paddington_export',{p_staff_code:staffCode}),rows=[['ticket_id','order','customer','ticket_type','checked_in_at','checked_in_by'],...d.results.map(x=>[x.ticket_id,x.order_no,x.customer,x.ticket_type,x.checked_in_at,x.checked_in_by])],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv'}));a.download='paddington-checkins-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)}catch(e){render('error','EXPORT FAILED',null,'Check the internet and try again.')}};
el('logout').onclick=()=>{localStorage.removeItem(CODE_KEY);staffCode='';el('staff-code').value='';el('login-overlay').classList.remove('hidden')};
setInterval(()=>{if(staffCode)refreshStats()},5000);if(staffCode){el('staff-code').value=staffCode;login()}
</script></body></html>
