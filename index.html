<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Paddington Check-in</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --ink:#171717; --paper:#f6f3ed; --card:#fff; --line:#d9d4cb; --green:#08783f; --green-bg:#e1f6e9; --red:#b42318; --red-bg:#fee9e7; --amber:#9a6700; --amber-bg:#fff3cd; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,560px); margin:auto; padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
    h1 { font-size:26px; margin:0 0 3px; }
    .subtitle { margin:0 0 14px; color:#67625a; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
    .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 6px; text-align:center; }
    .stat b { display:block; font-size:21px; }
    .stat span { display:block; color:#6e6961; font-size:11px; }
    #reader { overflow:hidden; min-height:280px; background:#111; border-radius:16px; border:1px solid #333; }
    #reader video { object-fit:cover; }
    #reader__dashboard_section_csr button, button { min-height:48px; border:0; border-radius:12px; padding:12px 14px; font-size:16px; font-weight:700; cursor:pointer; }
    #reader__dashboard_section_csr button { background:#fff; color:#111; margin:8px 0; }
    .primary { width:100%; background:var(--ink); color:#fff; }
    .secondary { width:100%; background:#e5e0d7; color:var(--ink); }
    .danger { color:var(--red); background:transparent; border:1px solid #e4b5b0; }
    #result { display:none; margin:12px 0; padding:18px; border-radius:16px; border:2px solid; }
    #result.ok { display:block; color:var(--green); background:var(--green-bg); border-color:#70c996; }
    #result.used { display:block; color:var(--red); background:var(--red-bg); border-color:#ed8e85; }
    #result.invalid { display:block; color:var(--red); background:var(--red-bg); border-color:#ed8e85; }
    #result.error { display:block; color:var(--amber); background:var(--amber-bg); border-color:#e2bd5a; }
    .result-title { font-size:23px; font-weight:850; margin-bottom:8px; }
    .customer { font-size:22px; font-weight:750; color:var(--ink); }
    .details { color:#4e4a44; margin-top:5px; line-height:1.45; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 14px; }
    details { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px; margin-top:10px; }
    summary { font-weight:750; cursor:pointer; }
    label { display:block; font-size:13px; color:#625d56; margin:12px 0 5px; }
    input { width:100%; min-height:48px; border:1px solid #bdb7ad; border-radius:11px; padding:11px; font-size:16px; background:#fff; }
    .search-result { display:flex; gap:8px; justify-content:space-between; align-items:center; border-top:1px solid #e2ded7; padding:10px 0; }
    .search-result:first-child { border-top:0; }
    .search-result button { flex:0 0 auto; min-height:40px; font-size:13px; background:#171717; color:#fff; }
    .small { font-size:12px; color:#746f67; }
    .footer-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .footer-actions button { min-height:42px; font-size:13px; background:#e5e0d7; }
    #camera-error { display:none; background:var(--amber-bg); color:#684600; padding:12px; border-radius:12px; margin:10px 0; }
  </style>
</head>
<body>
<main>
  <h1>RIFF Check-in</h1>
  <p class="subtitle">Náttfatapartý: Paddington · 99 tickets</p>

  <section class="stats" aria-label="Check-in statistics">
    <div class="stat"><b id="checked-count">0</b><span>CHECKED IN</span></div>
    <div class="stat"><b id="remaining-count">99</b><span>REMAINING</span></div>
    <div class="stat"><b id="total-count">99</b><span>TOTAL</span></div>
  </section>

  <div id="reader"></div>
  <div id="camera-error"></div>
  <div id="result" role="status" aria-live="assertive"></div>

  <div class="actions">
    <button id="next-button" class="primary">SCAN NEXT</button>
    <button id="undo-button" class="secondary">UNDO LAST</button>
  </div>

  <details>
    <summary>Manual code</summary>
    <label for="manual-token">QR code / token</label>
    <input id="manual-token" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="Paste or type the code">
    <button id="manual-check" class="primary">CHECK IN</button>
  </details>

  <details>
    <summary>Find by name or order</summary>
    <label for="search">Name or order number</label>
    <input id="search" autocomplete="off" placeholder="Start typing…">
    <div id="search-results"></div>
  </details>

  <div class="footer-actions">
    <button id="export-button">Export check-ins</button>
    <button id="reset-button" class="danger">Reset all</button>
  </div>
</main>

  const STORAGE_KEY = 'riff-paddington-checkins-v1';
  const TOTAL = Object.keys(DB).length;
  let used = loadUsed();
  let scanner = null;
  let scanLocked = false;
  let lastToken = null;

  const result = document.getElementById('result');
  const nextButton = document.getElementById('next-button');
  const undoButton = document.getElementById('undo-button');
  const manualToken = document.getElementById('manual-token');
  const searchInput = document.getElementById('search');
  const searchResults = document.getElementById('search-results');

  function loadUsed() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch (_) { return {}; }
  }

  function saveUsed() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(used));
    updateStats();
  }

  function updateStats() {
    const checked = Object.keys(used).filter(token => DB[token]).length;
    document.getElementById('checked-count').textContent = checked;
    document.getElementById('remaining-count').textContent = TOTAL - checked;
    document.getElementById('total-count').textContent = TOTAL;
  }

  function esc(value) {
    return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  }

  function normalizeToken(raw) {
    let value = String(raw || '').trim();
    try {
      const url = new URL(value);
      value = url.searchParams.get('token') || url.searchParams.get('code') || url.searchParams.get('qr') || url.hash.slice(1) || url.pathname.split('/').filter(Boolean).pop() || value;
    } catch (_) {}
    return value.trim();
  }

  function buzz(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  function renderTicket(kind, title, ticket, extra = '') {
    result.className = kind;
    result.innerHTML = '<div class="result-title">' + title + '</div>' +
      (ticket ? '<div class="customer">' + esc(ticket.customer) + '</div><div class="details">' + esc(ticket.ticket_type) + '<br>Order ' + esc(ticket.order) + ' · ' + esc(ticket.ticket_id) + '</div>' : '') +
      (extra ? '<div class="details">' + esc(extra) + '</div>' : '');
    result.scrollIntoView({behavior:'smooth', block:'center'});
  }

  function checkIn(raw, source = 'scan') {
    const token = normalizeToken(raw);
    const ticket = DB[token];
    if (!ticket) {
      lastToken = null;
      renderTicket('invalid', '✕ INVALID QR', null, token ? 'This code is not in the Paddington ticket list.' : 'No code was detected.');
      buzz([120, 80, 120]);
      scanLocked = true;
      return;
    }
    if (used[token]) {
      lastToken = null;
      const when = new Date(used[token].at).toLocaleString();
      renderTicket('used', '✕ ALREADY CHECKED IN', ticket, 'First check-in: ' + when);
      buzz([160, 70, 160]);
      scanLocked = true;
      return;
    }
    used[token] = {at:new Date().toISOString(), source};
    lastToken = token;
    saveUsed();
    renderTicket('ok', '✓ CHECKED IN', ticket);
    buzz(100);
    scanLocked = true;
    manualToken.value = '';
  }

  function resumeScanning() {
    scanLocked = false;
    result.className = '';
    result.innerHTML = '';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function onScanSuccess(text) {
    if (scanLocked) return;
    checkIn(text, 'camera');
  }

  function startCamera() {
    if (!window.Html5QrcodeScanner) {
      const box = document.getElementById('camera-error');
      box.style.display = 'block';
      box.textContent = 'The scanner library could not load. Check the internet connection, refresh the page, or use Manual code below.';
      return;
    }
    scanner = new Html5QrcodeScanner('reader', {
      fps: 12,
      qrbox: (w, h) => { const size = Math.floor(Math.min(w, h) * 0.72); return {width:size, height:size}; },
      aspectRatio: 1,
      rememberLastUsedCamera: true,
      supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA, Html5QrcodeScanType.SCAN_TYPE_FILE]
    }, false);
    scanner.render(onScanSuccess, () => {});
  }

  nextButton.addEventListener('click', resumeScanning);
  undoButton.addEventListener('click', () => {
    if (!lastToken || !used[lastToken]) {
      renderTicket('error', 'NOTHING TO UNDO', null, 'Only the most recent successful check-in can be undone here.');
      return;
    }
    const ticket = DB[lastToken];
    delete used[lastToken];
    saveUsed();
    renderTicket('error', 'CHECK-IN UNDONE', ticket);
    lastToken = null;
  });

  document.getElementById('manual-check').addEventListener('click', () => checkIn(manualToken.value, 'manual-code'));
  manualToken.addEventListener('keydown', event => { if (event.key === 'Enter') checkIn(manualToken.value, 'manual-code'); });

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLocaleLowerCase();
    searchResults.innerHTML = '';
    if (q.length < 2) return;
    const matches = Object.values(DB).filter(t => t.customer.toLocaleLowerCase().includes(q) || t.order.includes(q)).slice(0, 12);
    if (!matches.length) { searchResults.innerHTML = '<p class="small">No matching ticket.</p>'; return; }
    matches.forEach(ticket => {
      const row = document.createElement('div');
      row.className = 'search-result';
      const isUsed = Boolean(used[ticket.token]);
      row.innerHTML = '<div><b>' + esc(ticket.customer) + '</b><div class="small">' + esc(ticket.ticket_type) + ' · Order ' + esc(ticket.order) + (isUsed ? ' · CHECKED IN' : '') + '</div></div>';
      const button = document.createElement('button');
      button.textContent = isUsed ? 'SHOW' : 'CHECK IN';
      button.addEventListener('click', () => checkIn(ticket.token, 'manual-search'));
      row.appendChild(button);
      searchResults.appendChild(row);
    });
  });

  document.getElementById('export-button').addEventListener('click', () => {
    const rows = [['ticket_id','order','customer','ticket_type','checked_in_at','source']];
    Object.entries(used).forEach(([token, info]) => {
      const t = DB[token];
      if (t) rows.push([t.ticket_id,t.order,t.customer,t.ticket_type,info.at,info.source]);
    });
    const csv = rows.map(row => row.map(value => '"' + String(value).replace(/"/g,'""') + '"').join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'paddington-checkins-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById('reset-button').addEventListener('click', () => {
    if (!Object.keys(used).length) return;
    const answer = prompt('This deletes every check-in saved on this device. Type RESET to continue.');
    if (answer !== 'RESET') return;
    used = {};
    lastToken = null;
    saveUsed();
    renderTicket('error', 'ALL CHECK-INS RESET', null, 'The list on this device is empty again.');
  });

  window.addEventListener('storage', event => {
    if (event.key === STORAGE_KEY) { used = loadUsed(); updateStats(); }
  });

  updateStats();
  startCamera();
</script>
